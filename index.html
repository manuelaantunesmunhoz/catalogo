<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pudim Pudim | Cardápio</title>

    <link rel="stylesheet" href="style.css">
   
</head>

<body>

    <header>
        <h1>Pudim Pudim</h1>
        <p>Geladões gourmet feitos com carinho!</p>
    </header>

    <main>
        <section class="cardapio">
            <h2>Nosso cardápio</h2>

            <div class="produtos">

                <div class="produto">
                    <img src="imagens/imagens/morango.jpeg"
                         alt="Geladão gourmet de morango">

                </h3>Geladão de Morango</h3>
                    <p class="preco">R$ 9,00</p>

                    <label for="morango">Quantidade:</label>
                    <input type="number" id="morango"
                           min="0" step="1" value="0">

                <p>Subtotal: <span id="subtotal-morango">R$ 0,00</span</p>
                </div>

                <div class="produto">
                    <img src="imagens/imagens/nutella.jpeg"
                         alt="Geladão gourmet de Nutella">

                    <h3>Geladão de Nutella</h3>
                    <p class="preco">R$ 10,00</p>

                    <label for="nutella">Quantidade:</label>
                    <input type="number" id="nutella"
                           min="0" step="1" value="0">

                    <p>Subtotal: <span id="subtotal-nutella">R$ 0,00</span></p>
                </div>

                <div class="produto">
                    <img src="imagens/imagens/pudim.jpeg"
                         alt="Geladão gourmet de pudim">

                    <h3>Geladão de Pudim</h3>
                    <p class="preco">R$ 9,00</p>

                    <label for="pudim">Quantidade:</label>
                    <input type="number" id="pudim"
                           min="0" step="1" value="0">

                    <p>Subtotal: <span id="subtotal-pudim">R$ 0,00</span></p>
                </div>

            </div>
        </section>

        <section class="pedido">
            <h2>Faça seu pedido 💕</h2>

            <form id="formPedido">

                <label for="nome">Seu nome:</label>
                <input type="text" id="nome"
                       placeholder="Digite seu nome" required>

                <label for="telefone">Seu telefone:</label>
                <input type="tel" id="telefone"
                       placeholder="Seu número de contato" required>

                <label for="entrega">Como deseja receber?</label>
                <select id="entrega" required>
                    <option value="">Selecione uma opção</option>
                    <option value="Entrega">Entrega</option>
                    <option value="Retirada">Retirada</option>
                </select>

                <div id="campoEndereco" class="escondido">
                    <label for="endereco">Endereço completo:</label>
                    <textarea id="endereco"
                              placeholder="Rua, número, bairro e complemento"></textarea>
                </div>

                <label for="observacao">Observações (opcional):</label>
                <textarea id="observacao"
                          placeholder="Alguma informação adicional?"></textarea>

                <div class="total">
                    <h3>Total do pedido:</h3>
                    <p id="total">R$ 0,00</p>
                </div>

        <button type="button" id="finalizarPedido">
            Finalizar pedido pelo WhatsApp
</button>

            </form>
        </section>
    </main>

    <footer>
        <p>Feito com carinho 💗 Pudim Pudim</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
